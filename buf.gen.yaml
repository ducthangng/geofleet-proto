#       # Đặt tên cho file tổng đó (ví dụ: geofleet.swagger.json)
#       - merge_file_name=geofleet
#       - generate_unbound_methods=true

#   # 1. Plugin for Protobuf Messages (The "Data" part)
#   # Plugin for TypeScript Messages (ES) - Upgraded to v2 compatible
#   # Use the latest available plugin for Protobuf-ES
#   - remote: buf.build/bufbuild/es:v2.10.2
#     out: gen/ts
#     opt: target=ts

version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ducthangng/geofleet-proto/gen/go

plugins:
  # --- Go Plugins ---
  - remote: buf.build/protocolbuffers/go:v1.31.0
    out: gen/go
    opt: paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # --- OpenAPI ---
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.22.0
    out: gen/openapiv2
    opt:
      - allow_merge=true
      - merge_file_name=geofleet

  # --- Modern TypeScript (ES v2) ---
  - remote: buf.build/bufbuild/es:v2.2.3
    out: gen/ts
    opt: 
      - target=ts
      # - include_imports=true