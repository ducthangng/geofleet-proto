version: v1
plugins:
  # Plugin cho Go
  - plugin: buf.build/protocolbuffers/go:v1.31.0
    out: gen/go
    opt: paths=source_relative
  # Plugin cho gRPC Go
  - plugin: buf.build/grpc/go:v1.3.0
    out: gen/go
    opt: 
      - paths=source_relative
      - require_unimplemented_servers=false
  - plugin: buf.build/grpc-ecosystem/openapiv2:v2.18.0
    out: gen/openapiv2
    opt:
      - json_names_for_fields=true
      - logtostderr=true
      # Tự động gộp tất cả các file proto vào 1 file Swagger duy nhất
      - allow_merge=true
      # Đặt tên cho file tổng đó (ví dụ: geofleet.swagger.json)
      - merge_file_name=geofleet
      - generate_unbound_methods=true

  # 1. Plugin for Protobuf Messages (The "Data" part)
  - plugin: buf.build/bufbuild/es:v1.10.0
    out: gen/ts
    opt: target=ts

  # 2. Plugin for Connect/gRPC Services (The "Action" part)
  - plugin: buf.build/connectrpc/es:v1.1.0
    out: gen/ts
    opt: target=ts