syntax = "proto3";

package geofleet.ride.v1;
import "common/v1/common.proto"; // Import LatLng
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ducthangng/geofleet-proto/gen/go/geofleet/ride/v1;ridev1";

// RideService focus on the "while" of the service, while users are travelling.
service RideService {
    // Theo dõi nhiều chuyến xe cùng lúc (Server Streaming)
    rpc TrackMultipleRides(TrackMultipleRidesRequest) returns (stream TrackMultipleRidesResponse);

    // Stream from server to clients - can be user / driver / or server admins
    rpc GetRideStatus(GetRideStatusRequest) returns (stream GetRideStatusResponse);
}

enum RideStatus {
    RIDE_STATUS_UNSPECIFIED = 0; // Giá trị mặc định
    RIDE_STATUS_CREATED = 1; // User requested
    RIDE_STATUS_MATCHING = 2; // System pinging drivers
    RIDE_STATUS_ACCEPTED = 3; // Driver accepted
    RIDE_STATUS_ARRIVED = 4; // Driver at pick-up
    RIDE_STATUS_IN_PROGRESS = 5; // In the car
    RIDE_STATUS_COMPLETED = 6; // Arrived destination
    RIDE_STATUS_CANCELLED = 7; // Trip cancelled
}

enum PaymentMethod {
    PAYMENT_METHOD_UNSPECIFIED = 0;
    PAYMENT_METHOD_CASH = 1;
    PAYMENT_METHOD_WALLET = 2;
    PAYMENT_METHOD_CARD = 3;
}

message GetRideStatusRequest {
    string ride_id = 1;
}

message GetRideStatusResponse {
    string ride_id = 1;
    string passenger_id = 2;
    string driver_id = 3;
    geofleet.common.v1.LatLng pickup_point = 4;
    geofleet.common.v1.LatLng dropoff_point = 5;
    geofleet.common.v1.LatLng current_location = 6;

    RideStatus ride_status = 7;

    float estimate_fare = 8;
    float final_fare = 9;
    string currency = 10;
    PaymentMethod payment_method = 11;

    string cancel_reason = 12; 
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
}

message TrackMultipleRidesRequest {
    repeated string ride_ids = 1;
}

message TrackMultipleRidesResponse {
    string ride_id = 1;
    string user_id = 2;
    string driver_id = 3;
    geofleet.common.v1.LatLng current_location = 4;
    double estimated_price = 5;
    string status = 6; // e.g., ON_TRIP, PICKING_UP
}